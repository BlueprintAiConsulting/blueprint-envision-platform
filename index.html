<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Canonical Domain Redirect: Route any github.io traffic directly to the authoritative domain -->
    <script>
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var path = window.location.pathname.replace(/^\/blueprint-envision-platform/, '') || '/';
          window.location.replace('https://blueprint-envision.web.app' + path + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Primary Meta -->
    <title>BlueprintEnvision — Exterior Visualizer</title>
    <meta name="description" content="AI-powered exterior visualizer. Preview siding, shutters, trim, and accents on your home — see any color combination in seconds." />

    <!-- Google Fonts Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BlueprintEnvision — Exterior Visualizer" />
    <meta property="og:description" content="AI-powered exterior visualizer. Preview siding colors, shutters, trim, and accents on any home photo." />
    <meta property="og:image" content="https://blueprint-envision-platform.onrender.com/og-preview.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlueprintEnvision — AI-Powered Exterior Visualizer" />
    <meta name="twitter:description" content="Preview siding colors, shutters, trim, and accents on any home photo." />
    <meta name="twitter:image" content="https://blueprint-envision-platform.onrender.com/og-preview.png" />


  <style>
    #splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #05060c;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      background-image: radial-gradient(rgba(0, 128, 255, 0.14) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
    .splash-logo-icon {
      width: 52px; height: 52px; border-radius: 9999px; overflow: hidden;
      border: 2px solid rgba(0, 128, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 128, 255, 0.55);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    .splash-logo-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .splash-logo-text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .splash-logo-text h1 { font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; margin:0; }
    .splash-logo-text h1 span { color: #57c8ff; }
    .splash-logo-text p { font-size: 10px; font-weight: 700; color: #8fd9ff; letter-spacing: 0.2em; text-transform: uppercase; margin: 2px 0 0; font-family: 'JetBrains Mono', monospace; }
    .splash-bar-wrap { width: 280px; height: 2px; background: #162544; border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .splash-bar { height: 100%; background: linear-gradient(90deg, #007fff, #57c8ff); border-radius: 99px; animation: load-bar 4s ease-out forwards; }
    .splash-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #8fd9ff; letter-spacing: 0.15em; text-transform: uppercase; }
    @keyframes load-bar { 0% { width: 0% } 30% { width: 40% } 60% { width: 70% } 85% { width: 88% } 100% { width: 95% } }
    @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 20px rgba(0,127,255,0.45); } 50% { box-shadow: 0 0 40px rgba(87,200,255,0.75); } }
  </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-logo">
        <div class="splash-logo-icon">
          <img src="/bp-new-logo.jpg" alt="Blueprint AI Consulting Co." />
        </div>
        <div class="splash-logo-text">
          <h1>BLUEPRINT<span>ENVISION</span></h1>
          <p>Exterior Visualizer</p>
        </div>
      </div>
      <div class="splash-bar-wrap"><div class="splash-bar"></div></div>
      <div class="splash-status" id="splash-status">Initializing AI Engine...</div>
    </div>
    <div id="root"></div>
    <script>
      const msgs = ['Initializing AI Engine...','Loading material catalog...','Preparing visualization tools...','Almost ready...'];
      let i = 0;
      const el = document.getElementById('splash-status');
      const iv = setInterval(() => { i++; if(i < msgs.length && el) el.textContent = msgs[i]; else clearInterval(iv); }, 1200);
      // Auto-dismiss splash once React mounts (covers both landing and app routes)
      const splashObs = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          clearInterval(iv);
          const splash = document.getElementById('splash-screen');
          if (splash) splash.classList.add('hidden');
          setTimeout(() => { if (splash) splash.remove(); }, 700);
          splashObs.disconnect();
        }
      });
      splashObs.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
